<mat-toolbar color="primary" class="main-header mat-elevation-z4">
    <div class="header-container">
        <div class="brand" (click)="goLanding()">
            <img src="/lacaseagri-logo.svg" alt="La Case Agri" height="48" style="width: auto;" />
        </div>
        <span class="spacer"></span>
        @if(showAdminLogin || showOnBoarding || showUserMenu) {
        <div class="desktop-nav">
            @if(showAdminLogin) {

            <button mat-button class="nav-link" (click)="onAdminLogin()">
                <mat-icon>lock_open</mat-icon>
                PORTAIL ADMIN
            </button>
            }
            @if(showOnBoarding) {
            <button mat-flat-button color="accent" class="cta-small" (click)="onSubmit()">
                DÉMARRER L'ENREGISTREMENT
            </button>
            }
            @if(showUserMenu && user) {
            <button matButton="text" [matMenuTriggerFor]="menu">
                <mat-icon>person</mat-icon>
                {{ user.given_name }} {{ user.family_name }}
            </button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item disabled>
                    <p>{{ user.preferred_username }}</p>
                </button>
                <button (click)="onLogout()" mat-menu-item>Déconnexion</button>
            </mat-menu>
            }
        </div>

        <button mat-icon-button class="mobile-menu-toggle" [matMenuTriggerFor]="mobileMenu">
            <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #mobileMenu="matMenu">
            @if(showAdminLogin) {
            <button mat-menu-item (click)="onAdminLogin()">
                <mat-icon>lock_open</mat-icon>
                <span>PORTAIL ADMIN</span>
            </button>
            }
            @if(showOnBoarding) {
            <button mat-menu-item class="cta-small mobile-cta" (click)="onSubmit()">
                <mat-icon>add_business</mat-icon>
                <span>DÉMARRER L'ENREGISTREMENT</span>
            </button>
            }
            @if(showUserMenu && user) {
            <button mat-menu-item disabled>
                <p>{{ user.preferred_username }}</p>
            </button>
            <button mat-menu-item (click)="onLogout()">
                <mat-icon>logout</mat-icon>
                <span>Déconnexion</span>
            </button>
            }
        </mat-menu>
        }
    </div>
</mat-toolbar>
